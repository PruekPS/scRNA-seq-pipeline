# Recreate with: mamba env create -f envs/environment.yml
# Verify with:   conda run -n scrna python -c "import scanpy; print(scanpy.__version__)"
#                conda run -n scrna Rscript -e 'packageVersion("Seurat")'
#
# Version lower-bounds are load-bearing, not decoration: an earlier
# unpinned version of this file (package names only, no versions) solved
# on this Mac to scanpy 1.11.5, but solved on HiPerGator's conda-forge
# snapshot to scanpy 1.4.4 (2019) paired with a modern pandas that had
# already removed an internal module scanpy 1.4.4 imports at startup --
# completely broken, would not run any pipeline script. Caught by
# actually importing scanpy after "successful" install, not by trusting
# the installer's exit code. Pins below match what's proven to work by
# scripts/01-04 running clean end-to-end (see docs/*_deep_dive.html).
#
# harmonypy + the r-* / bioconductor-* deps below were added for
# scripts/02b_harmony_integration.py and scripts/07_cellchat_analysis.R
# (Harmony batch integration, CellChat cell-cell communication). This
# environment.yml only gets you the conda-installable pieces -- CellChat
# itself, NMF (needs >=0.28, conda caps at 0.21.0), and presto (CellChat's
# fast-Wilcoxon backend, GitHub-only, required or identifyOverExpressedGenes
# errors outright) all need a one-time GitHub/CRAN install AFTER this env is
# created. Run `bash envs/install_r_extras.sh` (as a SLURM job on a compute
# node, not the login node) to do all of that in one go -- each individual
# step (not yet the consolidated script as a single run) is validated
# against real failures hit on the 907,696-cell run on 2026-08-01/02.
name: scrna
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.11
  - scanpy>=1.11
  - anndata>=0.12
  - pandas>=2.3
  - numpy>=2.0
  - scipy>=1.17
  - leidenalg>=0.10
  - python-igraph>=0.11
  - umap-learn>=0.5.12
  - scikit-misc>=0.5
  - scrublet>=0.2.3
  # Pinned exactly, not >=: harmonypy 2.0.0 (conda's newest) threw a shape
  # error inside scanpy's harmony_integrate wrapper on the real 907,696-cell
  # run -- Z_corr came back as a ragged/object-dtype (50,) array instead of
  # a clean (907696, 50) float array, so `.T` was a no-op and obsm
  # assignment failed. Reproduced on real data, not hypothetical. 0.0.10 is
  # the well-established pre-rewrite version scanpy's wrapper was written
  # against; downgrading to it fixed the run.
  - harmonypy=0.0.10
  # For scripts/08_trajectory_paga.py + 09_cellrank_fate_mapping.py.
  # cellrank pulls in pygpcca (the GPCCA estimator) automatically as a
  # dependency; listed explicitly here anyway for visibility. NOT YET
  # installed/tested on HiPerGator as of this addition -- confirm both
  # resolve cleanly the same way harmonypy's version needed checking.
  - cellrank>=2.3
  - pygpcca>=1.0.4
  - matplotlib>=3.10
  - seaborn>=0.13
  - ipykernel
  - jupyterlab
  - r-base
  - r-seurat>=5.5
  - r-harmony>=2.0
  - r-dplyr>=1.2
  - r-ggplot2>=4.0
  - r-patchwork>=1.3
  - r-matrix>=1.7
  - bioconductor-singlecellexperiment>=1.32
  - bioconductor-zellkonverter>=1.20
  - r-remotes>=2.5
  - bioconductor-complexheatmap>=2.22
  - bioconductor-biocneighbors>=1.24
  - r-circlize>=0.4
  - r-svglite>=2.1
  # For scripts/11_pseudobulk_deseq2.R. bioconductor-complexheatmap is
  # already listed above (added for CellChat) and is reused for the
  # pseudobulk top-DE-gene heatmap -- no separate heatmap package needed.
  # Confirmed available on bioconda; not yet installed/tested on HiPerGator.
  - bioconductor-deseq2>=1.42
  # r-nmf deliberately NOT listed here: conda-forge/bioconda cap out at
  # NMF 0.21.0 (every build, every R version, confirmed via `conda search`)
  # but CellChat requires NMF >=0.23.0. Install it from CRAN instead --
  # `Rscript -e 'remotes::install_version("NMF", version="0.28", repos="https://cloud.r-project.org")'`
  # -- which compiles cleanly on HiPerGator's toolchain (unlike svglite,
  # which needed the conda-precompiled version above).
  - pip
  - pip:
      # For scripts/04c_celltypist_annotation.py (reference-based immune
      # annotation). PyPI wheel; installed on HiPerGator 2026-10-20 with
      # `python -m pip install celltypist==1.6.3`, which added only
      # openpyxl/et-xmlfile and left scanpy/pandas/numpy/sklearn untouched.
      # Models are downloaded separately (see the 04c docstring).
      - celltypist==1.6.3
      # For scripts/12_gsea_preranked.py (preranked GSEA on DESeq2 stats).
      # Installed on HiPerGator 2026-10-20 with
      # `python -m pip install --no-deps gseapy==1.1.3` -- its runtime deps
      # (numpy/scipy/pandas/matplotlib/requests) were already present, so
      # --no-deps guaranteed nothing else changed. Gene sets (e.g. MSigDB
      # Hallmark via gseapy.get_library) are fetched once and kept as a GMT.
      - gseapy==1.1.3
