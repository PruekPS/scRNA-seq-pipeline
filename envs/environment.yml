# Recreate with: mamba env create -f envs/environment.yml
# Verify with:   conda run -n scrna python -c "import scanpy; print(scanpy.__version__)"
#                conda run -n scrna Rscript -e 'packageVersion("Seurat")'
#
# Version lower-bounds are load-bearing, not decoration: an earlier
# unpinned version of this file (package names only, no versions) solved
# on this Mac to scanpy 1.11.5, but solved on HiPerGator's conda-forge
# snapshot to scanpy 1.4.4 (2019) paired with a modern pandas that had
# already removed an internal module scanpy 1.4.4 imports at startup --
# completely broken, would not run any pipeline script. Caught by
# actually importing scanpy after "successful" install, not by trusting
# the installer's exit code. Pins below match what's proven to work by
# scripts/01-04 running clean end-to-end (see docs/*_deep_dive.html).
name: scrna
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.11
  - scanpy>=1.11
  - anndata>=0.12
  - pandas>=2.3
  - numpy>=2.0
  - scipy>=1.17
  - leidenalg>=0.10
  - python-igraph>=0.11
  - umap-learn>=0.5.12
  - scikit-misc>=0.5
  - scrublet>=0.2.3
  - matplotlib>=3.10
  - seaborn>=0.13
  - ipykernel
  - jupyterlab
  - r-base
  - r-seurat>=5.5
  - r-harmony>=2.0
  - r-dplyr>=1.2
  - r-ggplot2>=4.0
  - r-patchwork>=1.3
  - r-matrix>=1.7
  - bioconductor-singlecellexperiment>=1.32
  - bioconductor-zellkonverter>=1.20
